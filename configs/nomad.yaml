services:
  # CHANGE THIS: Use your actual server hostname or domain instead of localhost
  api_host: "localhost"
  api_base_path: "/nomad-oasis"

oasis:
  is_oasis: true
  uses_central_user_management: true

plugins:
  entry_points:
    options:
      nomad_north_jupyter.north_tools:jupyter:
        north_tool:
          image: ghcr.io/fairmat-nfdi/nomad-north-jupyter:latest

meta:
  deployment: "My Custom Oasis"
  deployment_url: "https://localhost:8000/nomad-oasis"
  maintainer_email: "test@example.com"

logtransfer:
  enabled: false # Set to true if you want to activate log shipping

temporal:
  enabled: true

mongo:
  db_name: nomad_oasis_v1

elastic:
  entries_index: nomad_oasis_entries_v1
  materials_index: nomad_oasis_materials_v1

north:
  enabled: true
  enable_new_hub_api: true
