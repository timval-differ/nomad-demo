[build-system]
requires = ["setuptools>=82.0.1", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
fallback_version = "0.0"

[project]
classifiers = [
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
name = "nomad-distribution"
description = "nomad distribution template for demo at DIFFER"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["nomad-lab[infrastructure]==1.4.2"]

[project.urls]
repository = "https://github.com/timval-differ/nomad-demo"

[project.optional-dependencies]
# Add your plugins to the list below.
plugins = [
    "nomad-north-jupyter>=0.2.5",
    "pynxtools>=0.13.2",
    "pynxtools-ellips==0.1.2",
    "pynxtools-xrd==0.0.8",
    "nomad-measurements>=1.3.4",
    "nomad-material-processing @ git+https://github.com/FAIRmat-NFDI/nomad-material-processing.git@v1.0.6",
    "nomad-gui==2.0.0b1"
]

jupyter = ["jupyter-events"]
gpu-action = []
cpu-action = []

dev = ["nomad-lab[infrastructure, dev]==1.4.3"]

[tool.uv]
extra-index-url = [
  "https://gitlab.mpcdf.mpg.de/api/v4/projects/2187/packages/pypi/simple",
]
prerelease = "explicit"

[tool.setuptools.packages.find]
exclude = ["gui*", "docs*", "config*"]
